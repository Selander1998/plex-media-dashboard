name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash -l {0}
        working-directory: ${{ vars.APP_DIR }}

    steps:
      - name: Pull latest changes
        run: git pull origin main

      - name: Install dependencies
        run: npm ci && npm ci --prefix client

      - name: Build frontend
        run: npm run build --prefix client

      - name: Restart app
        run: pm2 restart ecosystem.config.cjs
